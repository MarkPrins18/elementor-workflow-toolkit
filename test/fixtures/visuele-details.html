<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Visuele details die Elementor niet native kan</title>
<style>
  body { margin:0; font-family: Arial, sans-serif; }
  .poster {
    max-width: 420px;
    aspect-ratio: 2/3;
    display: flex;
    flex-wrap: wrap;
    padding: 22px;
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
    transform: rotate(1.6deg);
    background: linear-gradient(180deg,#5b1d16 0%,#2a0f0d 100%);
    opacity: .95;
  }
  .slot { position: relative; padding: 10px 18px; }
  .slot::before { content:""; position:absolute; top:50%; left:-5px; width:10px; height:10px; border-radius:50%; background:#fff; }
  .slot::after { content:""; position:absolute; top:50%; right:-5px; width:10px; height:10px; border-radius:50%; background:#fff; }
</style>
</head>
<body>
  <div class="poster" data-cmp="poster"><span data-cmp="poster-titel">De Laatste Trein</span></div>
  <a class="slot" href="#" data-cmp="slot">14:30</a>
  <div id="lijst" data-cmp="lijst"></div>
<script>
  document.getElementById("lijst").innerHTML = '<p data-cmp="lijst-regel">Door JavaScript opgebouwd na het laden.</p>';
</script>
</body>
</html>
