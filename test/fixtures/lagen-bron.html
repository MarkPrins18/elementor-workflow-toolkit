<!doctype html>
<html lang="nl">

<title>Bron: titel, bodytekst en knop</title>

</style>
</head>
<body>
  <section class="blok" data-cmp="blok">
    <h2 class="titel" data-cmp="titel">Sectietitel</h2>

    <a class="knop" href="#" data-cmp="knop">Plan afspraak</a>

</html>
